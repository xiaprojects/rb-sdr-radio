name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # No SDR in CI. librtlsdr-dev is what lets the binding tests compile a fake
      # library against the real header.
      - run: sudo apt-get update && sudo apt-get install -y librtlsdr-dev alsa-utils
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
